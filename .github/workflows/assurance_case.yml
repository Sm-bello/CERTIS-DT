name: Generate Airworthiness Assurance Case

on:
  push:
    branches: [ main ]

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Mission & Generate Certification Docket
      run: |
        python -m certis_dt.cli.main run-mission --agents 3 --duration 5.0 --output-dir ./output

    - name: Upload Certification Docket Artifact
      uses: actions/upload-artifact@v4
      with:
        name: airworthiness-certification-docket
        path: ./output/
